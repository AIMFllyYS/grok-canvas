name: Workstation CI

on:
  push:
    branches: [feat/workstation-performance]
  pull_request:
    branches: [feat/workstation-performance]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: workstation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.22.2
          - os: ubuntu-latest
            node: 24.20.0
          - os: windows-latest
            node: 24.20.0
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GROK_CANVAS_PORT: '3210'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate plan and dependency graph
        run: pnpm plan:validate
      - name: Typecheck
        run: pnpm typecheck
      - name: Full registered tests
        run: pnpm test
      - name: Check whitespace errors
        run: git diff --check
      - name: Production build
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.20.0'
        run: pnpm build
      - name: PDCA evidence and completed dependencies
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == '24.20.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/planning/validate-plan.mjs --pr
      - name: Upload non-secret build metadata
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == '24.20.0'
        uses: actions/upload-artifact@v4
        with:
          name: workstation-build-metadata-${{ github.sha }}
          path: |
            .next/BUILD_ID
            .next/routes-manifest.json
            docs/workstation-plan/evidence/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
